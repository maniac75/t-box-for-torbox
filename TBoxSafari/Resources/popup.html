<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark}
body{margin:0;min-width:300px;font:15px -apple-system,system-ui,sans-serif;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header img{width:32px;height:32px;border-radius:8px}
h1{font-size:18px;margin:0}
.status{margin:0 0 12px;color:#666;font-size:13px}
.ok{color:#1b8248;font-weight:600}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(128,128,128,.25);word-break:break-all;font-size:14px}
label small{display:block;color:#888}
input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px;accent-color:#1b8248}
button{width:100%;min-height:46px;border:0;border-radius:12px;font:600 16px -apple-system,system-ui,sans-serif}
#send{background:#1b8248;color:#fff;margin-top:12px}
#send:disabled{opacity:.4}
#toggle{background:rgba(128,128,128,.15);color:inherit;margin-top:10px;font-weight:500;font-size:14px}
.empty{color:#888;font-size:14px;padding:8px 0}
@media (prefers-color-scheme:dark){.status{color:#aaa}}
</style>
</head>
<body>
<header><img src="icon-96.png" alt=""><h1>T-Box</h1></header>
<p class="status" id="status"></p>
<div id="list"></div>
<button id="send" type="button" hidden></button>
<button id="toggle" type="button" hidden></button>
<script src="popup.js"></script>
</body>
</html>
