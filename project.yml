name: TBox
options:
  bundleIdPrefix: io.github.maniac75
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  TBox:
    type: application
    platform: iOS
    sources:
      - TBox
    dependencies:
      - package: ZIPFoundation
      - target: TBoxShare
    settings:
      base:
        PRODUCT_NAME: TBox
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maniac75.tbox
        INFOPLIST_FILE: TBox/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  TBoxShare:
    type: app-extension
    platform: iOS
    sources:
      - TBoxShare
      - path: TBox/Models.swift
      - path: TBox/TorBoxAPI.swift
      - path: TBox/Config.swift
      - path: TBox/Diagnostics.swift
      - path: TBox/Keychain.swift
      - path: TBox/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: TBoxShare
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maniac75.tbox.share
        INFOPLIST_FILE: TBoxShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  TBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TBoxTests
      - path: TBox/Models.swift
      - path: TBox/TorBoxAPI.swift
      - path: TBox/Config.swift
      - path: TBox/Diagnostics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maniac75.tbox.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  TBox:
    build:
      targets:
        TBox: all
    test:
      targets:
        - TBoxTests
